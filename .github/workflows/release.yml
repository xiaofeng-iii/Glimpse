name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: glimpse-frontend/package-lock.json

      - name: Verify release tag and synchronized version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/set_version.py --check --expected $version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Install frontend dependencies
        working-directory: glimpse-frontend
        run: npm ci

      - name: Run Python unit tests
        run: python -m pytest tests/unit -q

      - name: Build Windows installer
        shell: cmd
        run: build_release.bat

      - name: Create checksums and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleDirectory = "glimpse-frontend/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleDirectory -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No NSIS installer was produced in $bundleDirectory"
          }

          $checksumPath = Join-Path $bundleDirectory "SHA256SUMS.txt"
          $checksumLines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          Set-Content -Path $checksumPath -Value $checksumLines -Encoding ascii

          $assets = @($installers.FullName) + @((Resolve-Path $checksumPath).Path)
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --generate-notes `
              --title "Glimpse $env:GITHUB_REF_NAME"
          }
