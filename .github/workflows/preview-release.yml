name: Build preview release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]"
      - "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+"

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    name: Windows preview installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: glimpse-frontend/package-lock.json

      - name: Verify preview tag and synchronized version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<ver>[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]{8}(?:\.[0-9]+)?)$') {
            throw "Preview tag must be vMAJOR.MINOR.PATCH-preview.YYYYMMDD[.N], got: $env:GITHUB_REF_NAME"
          }
          $version = $Matches['ver']
          if ($version -notmatch '^(?<base>[0-9]+\.[0-9]+\.[0-9]+)-preview\.(?<date>[0-9]{8})(?:\.(?<sequence>[0-9]+))?$') {
            throw "Preview version must be <base>-preview.YYYYMMDD[.N], got: $version"
          }
          $current = python scripts/set_version.py --current
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the current synchronized version: $current"
          }
          if ($current -ne $version) {
            throw "Repository version is $current, expected $version"
          }
          python scripts/set_version.py --check --expected $version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Install frontend dependencies
        working-directory: glimpse-frontend
        run: npm ci

      - name: Run Python unit tests
        run: python -m pytest tests/unit -q

      - name: Build Windows installer
        shell: cmd
        run: build_release.bat

      - name: Smoke test bundled backend sidecar
        shell: pwsh
        run: |
          $sidecar = "glimpse-frontend/src-tauri/binaries/GlimpseRuntime/GlimpseRuntime.exe"
          if (-not (Test-Path -LiteralPath $sidecar)) {
            throw "Bundled backend sidecar missing: $sidecar"
          }
          $port = 58123
          $token = "preview-smoke-token"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "sidecar-smoke-$port.out"
          $stderrPath = Join-Path $env:RUNNER_TEMP "sidecar-smoke-$port.err"
          $process = Start-Process -FilePath $sidecar `
            -ArgumentList "--host","127.0.0.1","--port","$port","--auth-token",$token `
            -PassThru -WindowStyle Hidden -WorkingDirectory (Split-Path $sidecar) `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $response = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -UseBasicParsing `
                  -Uri "http://127.0.0.1:$port/api/health" `
                  -Headers @{ "X-Glimpse-Auth" = $token } `
                  -TimeoutSec 3
                break
              } catch {
                if ($process.HasExited) {
                  $stderrTail = Get-Content -Path $stderrPath -Tail 40 -ErrorAction SilentlyContinue
                  throw "Backend sidecar exited early (code $($process.ExitCode)): $($_.Exception.Message)`n$($stderrTail -join "`n")"
                }
              }
            }
            if (-not $response) {
              throw "Backend sidecar health check timed out"
            }
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch "healthy") {
              throw "Backend health check failed: $($response.StatusCode) $($response.Content)"
            }
            Write-Host "Backend sidecar smoke test passed: $($response.Content)"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            Remove-Item $stdoutPath,$stderrPath -ErrorAction SilentlyContinue
          }

      - name: Create checksums and publish preview GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleDirectory = "glimpse-frontend/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleDirectory -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No NSIS installer was produced in $bundleDirectory"
          }

          $checksumPath = Join-Path $bundleDirectory "SHA256SUMS.txt"
          $checksumLines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          Set-Content -Path $checksumPath -Value $checksumLines -Encoding ascii

          $assets = @($installers.FullName) + @((Resolve-Path $checksumPath).Path)
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseTag = "v$version"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets --clobber
          } else {
            gh release create $releaseTag @assets `
              --prerelease `
              --target "$env:GITHUB_SHA" `
              --generate-notes `
              --title "Glimpse $releaseTag (preview)"
          }
