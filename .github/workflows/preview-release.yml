name: Build private preview release

on:
  push:
    tags:
      - "v[0-9]{8}"
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version as YYYYMMDD"
        required: true
        default: "20260803"
        type: string

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    name: Windows preview installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: glimpse-frontend/package-lock.json

      - name: Verify preview tag and synchronized version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "push") {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]{8})$') {
              throw "Preview tag must be vYYYYMMDD, got: $env:GITHUB_REF_NAME"
            }
            $Matches[1]
          } else {
            "${{ github.event.inputs.version }}"
          }
          if ($version -notmatch '^[0-9]{8}$') {
            throw "Preview version must be YYYYMMDD, got: $version"
          }
          $year = $version.Substring(0, 4)
          $month = [int]$version.Substring(4, 2)
          $day = [int]$version.Substring(6, 2)
          $expected = "$year.$month.$day"
          python scripts/set_version.py --check --expected $expected

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Install frontend dependencies
        working-directory: glimpse-frontend
        run: npm ci

      - name: Run Python unit tests
        run: python -m pytest tests/unit -q

      - name: Build Windows installer
        shell: cmd
        run: build_release.bat

      - name: Create checksums and publish private draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleDirectory = "glimpse-frontend/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleDirectory -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No NSIS installer was produced in $bundleDirectory"
          }

          $checksumPath = Join-Path $bundleDirectory "SHA256SUMS.txt"
          $checksumLines = foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          Set-Content -Path $checksumPath -Value $checksumLines -Encoding ascii

          $assets = @($installers.FullName) + @((Resolve-Path $checksumPath).Path)
          $version = if ($env:GITHUB_EVENT_NAME -eq "push") {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            "${{ github.event.inputs.version }}"
          }
          $releaseTag = "v$version"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets --clobber
          } else {
            gh release create $releaseTag @assets `
              --draft `
              --target "$env:GITHUB_SHA" `
              --generate-notes `
              --title "Glimpse $releaseTag (private preview)"
          }
