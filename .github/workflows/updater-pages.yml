name: Publish updater feeds to GitHub Pages

on:
  workflow_run:
    workflows:
      - Build and publish release
      - Build preview release
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: updater-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate signed update feeds from published Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_update_feed.py "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
