[package]
name = "glimpse"
version = "0.3.1"
description = "AI-powered desktop memory assistant"
authors = ["Glimpse Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# 与 tauri 2.11 的内部依赖版本保持一致，直接复用编译缓存。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
