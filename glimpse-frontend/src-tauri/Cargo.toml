[package]
name = "glimpse"
version = "0.5.0-beta.4"
description = "AI-powered desktop memory assistant"
authors = ["Glimpse Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.13", features = ["rustls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
minisign-verify = "0.2"
base64 = "0.22"
url = "2"
semver = "1"
futures-util = "0.3"

# 与 tauri 2.11 的内部依赖版本保持一致，直接复用编译缓存。
# 引入 global-shortcut（global-hotkey 0.8 → windows 0.62）后，tauri 树内的
# webview2-com 统一解析到 0.39.x，这里必须跟着抬，否则两版 windows-core 并存、
# COM 接口的 Param 实现不互通。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
clipboard-win = "5.4.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
